<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="unstableBoltFavGrad" x1="20" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="45%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF1744" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer diamond frame with contrast outline for dark and light tabs -->
  <path
    d="M50 6 L92 42 L84 50 L92 58 L50 94 L8 58 L16 50 L8 42 Z"
    fill="#0a0a0c"
    stroke="#FF1744"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Fractured inner lightning bolt with neon gradient -->
  <path
    d="M54 14 L26 52 H48 L42 86 L74 44 H52 Z"
    fill="url(#unstableBoltFavGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Glitch highlight edge for sharp rendering at 16px/32px -->
  <path
    d="M54 14 L26 52 H48"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
</svg>
